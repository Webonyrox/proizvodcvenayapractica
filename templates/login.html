{% extends "base.html" %}
{% block title %}Вход — DveriApp{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Вход</h2>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Логин
      <input name="login" required>
    </label>
    <label>Пароль
      <input type="password" name="password" required>
    </label>
    <button class="btn btn-full" type="submit">Войти</button>
  </form>
  <p class="muted">Нет аккаунта? <a href="{{ url_for('register') }}">Регистрация</a></p>
</div>
{% endblock %}
